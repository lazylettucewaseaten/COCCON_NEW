
defaults:
  supporter: sft_with_thoughts
  architecture: decomposed
  gate: conformal
  memory: needstate
  simulator: proactive
  eval_set: own_heldout

arms:

  base_instruct:        {supporter: base,              architecture: monolithic, gate: off, memory: none}
  sft_wo_thoughts:      {supporter: sft_wo_thoughts,   architecture: monolithic, gate: off, memory: none}
  sft_with_thoughts:    {supporter: sft_with_thoughts, architecture: monolithic, gate: off, memory: none}
  reactive_baseline:    {supporter: base,              architecture: monolithic, gate: off, memory: none, simulator: reactive}

  cellA_mono_ungated:   {architecture: monolithic, gate: off}
  cellB_mono_gated:     {architecture: monolithic, gate: conformal}
  cellC_dec_ungated:    {architecture: decomposed, gate: off}
  cellD_dec_gated:      {architecture: decomposed, gate: conformal}
  cellD_extes:          {architecture: decomposed, gate: conformal, memory: none, eval_set: extes}
  calib_dec_ungated:    {architecture: decomposed, gate: off, eval_set: calibration}

  gate_alpha_005:       {gate: conformal, gate_alpha: 0.05}
  gate_alpha_010:       {gate: conformal, gate_alpha: 0.10}
  gate_alpha_020:       {gate: conformal, gate_alpha: 0.20}

  mem_none:             {supporter: base, architecture: decomposed, gate: off, memory: none,      multi_session: true, advance_profile: true, simulator: corrective}
  mem_summary:          {supporter: base, architecture: decomposed, gate: off, memory: summary,   multi_session: true, advance_profile: true, simulator: corrective}
  mem_dense:            {supporter: base, architecture: decomposed, gate: off, memory: dense,     multi_session: true, advance_profile: true, simulator: corrective}
  mem_event:            {supporter: base, architecture: decomposed, gate: off, memory: event,     multi_session: true, advance_profile: true, simulator: corrective}
  
  mem_needstate:        {supporter: base, architecture: decomposed, gate: off, memory: needstate, multi_session: true, advance_profile: true, simulator: corrective}
  sftmem_zero_shot:     {supporter: sft_with_thoughts,    architecture: monolithic, gate: off, memory: needstate, memory_writer: true, multi_session: true, advance_profile: true, simulator: corrective}
  sftmem_with_thoughts: {supporter: sftmem_with_thoughts, architecture: monolithic, gate: off, memory: needstate, memory_writer: true, multi_session: true, advance_profile: true, simulator: corrective}
  sftmem_wo_thoughts:   {supporter: sftmem_wo_thoughts,   architecture: monolithic, gate: off, memory: needstate, memory_writer: true, multi_session: true, advance_profile: true, simulator: corrective}
  sftmem_no_memory:     {supporter: sftmem_with_thoughts, architecture: monolithic, gate: off, memory: none,      multi_session: true, advance_profile: true, simulator: corrective}

  corpus_ours:          {supporter: sft_with_thoughts, architecture: monolithic, gate: off, memory: none}
  corpus_ours_wo:       {supporter: sft_wo_thoughts,   architecture: monolithic, gate: off, memory: none}
  corpus_esconv:        {supporter: corpus_esconv,     architecture: monolithic, gate: off, memory: none}
  corpus_extes:         {supporter: corpus_extes,      architecture: monolithic, gate: off, memory: none}
  corpus_smile:         {supporter: corpus_smile,      architecture: monolithic, gate: off, memory: none}
  corpus_ours_extes_profiles:   {supporter: sft_with_thoughts, architecture: monolithic, gate: off, memory: none, eval_set: extes}
  corpus_esconv_extes_profiles: {supporter: corpus_esconv,     architecture: monolithic, gate: off, memory: none, eval_set: extes}
  corpus_extes_extes_profiles:  {supporter: corpus_extes,      architecture: monolithic, gate: off, memory: none, eval_set: extes}

adapters:
  base: null
  sft_with_thoughts: null       # e.g. runs/<run_id>/adapter_with_thoughts
  sft_wo_thoughts: null
  sftmem_with_thoughts: null    # Option C: runs/memcorpus/adapter_with_thoughts (scripts/memcorpus.sh passes --adapter)
  sftmem_wo_thoughts: null
  corpus_esconv: null
  corpus_extes: null
  corpus_smile: null

eval_sets:
  own_heldout:  {path: data/profiles/profiles_test.jsonl,      in_distribution: true}
  calibration:  {path: data/profiles/profiles_calibration.jsonl, in_distribution: true}
  extes:        {path: data/external/extes_profiles.jsonl,     in_distribution: false}
  es_memeval:   {path: data/external/es_memeval_profiles.jsonl, in_distribution: false}
